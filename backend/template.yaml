AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Easy Drop-In backend proxy for Vancouver community centre calendars

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs20.x

Resources:
  # Single tiny JSON object shared between Lambda instances so a cold start
  # reuses the last merged feed instead of refetching every calendar.
  # Usage is a handful of GETs/PUTs per hour, far inside the S3 free tier.
  FeedCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireStaleCache
            Status: Enabled
            ExpirationInDays: 7

  # One item per "notify me when registration opens" subscription. On-demand
  # billing and TTL cleanup keep it inside the DynamoDB free tier.
  WatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: watchId
          AttributeType: S
      KeySchema:
        - AttributeName: watchId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Assumed by EventBridge Scheduler to invoke this same Lambda at the
  # registration-open time. Scoped to this stack's function.
  WatchSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeEventsFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-EventsFunction-*'

  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SPORTS_CALENDARS: 46,10,9,15,11,49,5
          CACHE_BUCKET: !Ref FeedCacheBucket
          CACHE_KEY: feed.json
          # 30 min: caps S3 writes at ~1,440/month (free tier: 2,000 PUT).
          FEED_TTL_MS: '1800000'
          WATCHES_TABLE: !Ref WatchesTable
          SCHEDULER_ROLE_ARN: !GetAtt WatchSchedulerRole.Arn
          # Notification destination, set after deploy (see README/AWS_SETUP).
          NOTIFY_KIND: ntfy
          NOTIFY_WEBHOOK_URL: ''
          NOTIFY_TELEGRAM_CHAT_ID: ''
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${FeedCacheBucket.Arn}/*'
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
              Resource: !GetAtt WatchesTable.Arn
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:GetSchedule
                - scheduler:DeleteSchedule
              Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/*'
        - Statement:
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt WatchSchedulerRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        GetEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /events
            Method: get
        GetSpots:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /spots
            Method: get
        PostWatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /watch
            Method: post
        ListWatches:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /watch
            Method: get
        DeleteWatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /watch/{id}
            Method: delete

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type

Outputs:
  ApiUrl:
    Description: Base URL of the events API
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/events'
